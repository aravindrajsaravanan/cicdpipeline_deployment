# Apply once after Argo CD is installed:
#   kubectl apply -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-app
  namespace: argocd
  # Deleting this Application also deletes everything it created (including the AWS load balancer)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aravindrajsaravanan/cicdpipeline_deployment.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-app
  syncPolicy:
    automated:
      prune: true      # remove resources deleted from Git
      selfHeal: true   # undo manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
